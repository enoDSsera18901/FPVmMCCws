name: Pair-2 PX4 SIH runtime

on:
  pull_request:
    paths:
      - 'integration/sitl/**'
      - 'integration/ros2_ws/**'
      - 'tools/evaluate_pair2_sih_smoke.py'
      - 'tools/probe_pair2_sih.py'
      - 'tests/test_pair2_sih_smoke.py'
      - '.github/workflows/pair2-sih-runtime.yml'
  workflow_dispatch:

jobs:
  pair2-sih-no-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ROS_DISTRO: jazzy
      PX4_SHA: d6f12ad1c4f70ad3230afd7d86e971421e02fef4
      PX4_MSGS_SHA: 86d8239e962f6939e05c3737784f60c02fa884db
      XRCE_AGENT_SHA: 73622810d984349b80bbac0ef55fc0b694d62222
      ROS_APT_SOURCE_VERSION: 1.2.0
      ROS_APT_SOURCE_SHA256: 0804d9b13db770eb87019be414cd78378835228ad5fa801fc88758596dd8f7e5
    steps:
      - name: Checkout controller
        uses: actions/checkout@v4
      - name: Checkout pinned px4_msgs
        uses: actions/checkout@v4
        with:
          repository: PX4/px4_msgs
          ref: 86d8239e962f6939e05c3737784f60c02fa884db
          path: integration/ros2_ws/src/px4_msgs
          fetch-depth: 1
      - name: Checkout pinned PX4
        uses: actions/checkout@v4
        with:
          repository: PX4/PX4-Autopilot
          ref: d6f12ad1c4f70ad3230afd7d86e971421e02fef4
          path: upstream/PX4-Autopilot
          fetch-depth: 1
          submodules: recursive
      - name: Checkout pinned Micro-XRCE-DDS-Agent
        uses: actions/checkout@v4
        with:
          repository: eProsima/Micro-XRCE-DDS-Agent
          ref: 73622810d984349b80bbac0ef55fc0b694d62222
          path: upstream/Micro-XRCE-DDS-Agent
          fetch-depth: 1
          submodules: recursive
      - name: Install ROS 2 Jazzy and build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          curl -fL "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.noble_all.deb" -o /tmp/ros2-apt-source.deb
          echo "${ROS_APT_SOURCE_SHA256}  /tmp/ros2-apt-source.deb" | sha256sum -c -
          sudo dpkg -i /tmp/ros2-apt-source.deb
          sudo apt-get update
          sudo apt-get install -y ros-jazzy-ros-base python3-colcon-common-extensions python3-rosdep build-essential cmake
          sudo rosdep init 2>/dev/null || true
          rosdep update --rosdistro jazzy
      - name: Verify frozen provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream/PX4-Autopilot rev-parse HEAD)" = "${PX4_SHA}"
          test "$(git -C integration/ros2_ws/src/px4_msgs rev-parse HEAD)" = "${PX4_MSGS_SHA}"
          test "$(git -C upstream/Micro-XRCE-DDS-Agent rev-parse HEAD)" = "${XRCE_AGENT_SHA}"
          python3 tools/verify_pair2_identity.py
          mkdir -p evidence/pair2-sih
          {
            echo "controller_sha=${GITHUB_SHA}"
            echo "px4_sha=${PX4_SHA}"
            echo "px4_msgs_sha=${PX4_MSGS_SHA}"
            echo "xrce_agent_sha=${XRCE_AGENT_SHA}"
            echo "runner=$(grep '^PRETTY_NAME=' /etc/os-release | cut -d= -f2-)"
            echo "ros_distro=${ROS_DISTRO}"
          } | tee evidence/pair2-sih/provenance.txt
      - name: Install PX4 host dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash upstream/PX4-Autopilot/Tools/setup/ubuntu.sh --no-nuttx --no-sim-tools
      - name: Build pinned XRCE agent
        shell: bash
        run: |
          set -euo pipefail
          cmake -S upstream/Micro-XRCE-DDS-Agent -B upstream/Micro-XRCE-DDS-Agent/build -DCMAKE_BUILD_TYPE=Release
          cmake --build upstream/Micro-XRCE-DDS-Agent/build --parallel 2
          AGENT_BIN="$(find upstream/Micro-XRCE-DDS-Agent/build -type f -name MicroXRCEAgent -perm -111 | head -n1)"
          test -n "${AGENT_BIN}"
          echo "AGENT_BIN=$(realpath "${AGENT_BIN}")" >> "${GITHUB_ENV}"
      - name: Build controller ROS workspace
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          rosdep install --from-paths integration/ros2_ws/src --ignore-src --rosdistro jazzy -r -y
          cd integration/ros2_ws
          colcon build --event-handlers console_direct+ --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo 2>&1 | tee ../../evidence/pair2-sih/colcon-build.log
          test -x install/coordination_px4_bridge/lib/coordination_px4_bridge/coordination_px4_bridge
      - name: Build PX4 v1.17 SITL binary
        shell: bash
        run: |
          set -euo pipefail
          make -C upstream/PX4-Autopilot px4_sitl_default -j2 2>&1 | tee evidence/pair2-sih/px4-build.log
          PX4_BIN="$(realpath upstream/PX4-Autopilot/build/px4_sitl_default/bin/px4)"
          PX4_ETC="$(realpath upstream/PX4-Autopilot/build/px4_sitl_default/etc)"
          test -x "${PX4_BIN}"
          test -d "${PX4_ETC}"
          echo "PX4_BIN=${PX4_BIN}" >> "${GITHUB_ENV}"
          echo "PX4_ETC=${PX4_ETC}" >> "${GITHUB_ENV}"
      - name: Run two live PX4 SIH instances and no-gate probe
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(realpath integration/ros2_ws)"
          EVIDENCE="$(realpath evidence/pair2-sih)"
          mkdir -p runtime/px4-0 runtime/px4-1
          set +u
          source /opt/ros/jazzy/setup.bash
          source "${WORKSPACE}/install/setup.bash"
          set -u
          cleanup() {
            kill "${B1:-}" "${B2:-}" "${P0:-}" "${P1:-}" "${AGENT_PID:-}" 2>/dev/null || true
            wait "${B1:-}" "${B2:-}" "${P0:-}" "${P1:-}" "${AGENT_PID:-}" 2>/dev/null || true
          }
          trap cleanup EXIT
          "${AGENT_BIN}" udp4 -p 8888 > "${EVIDENCE}/xrce-agent.log" 2>&1 &
          AGENT_PID=$!
          sleep 2
          kill -0 "${AGENT_PID}"
          (cd runtime/px4-0 && env PX4_SYS_AUTOSTART=10040 PX4_SIM_MODEL=sihsim_quadx PX4_SIMULATOR=sihsim PX4_UXRCE_DDS_NS=coord_001 ROS_DOMAIN_ID=0 "${PX4_BIN}" -i 0 -d "${PX4_ETC}") > "${EVIDENCE}/px4-0.log" 2>&1 &
          P0=$!
          (cd runtime/px4-1 && env PX4_SYS_AUTOSTART=10040 PX4_SIM_MODEL=sihsim_quadx PX4_SIMULATOR=sihsim PX4_UXRCE_DDS_NS=coord_002 ROS_DOMAIN_ID=0 "${PX4_BIN}" -i 1 -d "${PX4_ETC}") > "${EVIDENCE}/px4-1.log" 2>&1 &
          P1=$!
          ros2 run coordination_px4_bridge coordination_px4_bridge --ros-args -r __node:=coordination_px4_bridge_1 -p node_id:=1 -p px4_namespace:=coord_001 > "${EVIDENCE}/bridge-1.log" 2>&1 &
          B1=$!
          ros2 run coordination_px4_bridge coordination_px4_bridge --ros-args -r __node:=coordination_px4_bridge_2 -p node_id:=2 -p px4_namespace:=coord_002 > "${EVIDENCE}/bridge-2.log" 2>&1 &
          B2=$!
          ready=0
          for _ in $(seq 1 45); do
            kill -0 "${P0}" && kill -0 "${P1}" && kill -0 "${B1}" && kill -0 "${B2}" && kill -0 "${AGENT_PID}"
            ros2 topic list | sort > "${EVIDENCE}/topics.txt" || true
            if grep -qx '/coord_001/fmu/out/vehicle_status' "${EVIDENCE}/topics.txt" && grep -qx '/coord_002/fmu/out/vehicle_status' "${EVIDENCE}/topics.txt" && grep -qx '/coord_001/fmu/out/vehicle_local_position' "${EVIDENCE}/topics.txt" && grep -qx '/coord_002/fmu/out/vehicle_local_position' "${EVIDENCE}/topics.txt"; then
              ready=1
              break
            fi
            sleep 1
          done
          test "${ready}" -eq 1
          python3 tools/probe_pair2_sih.py --manifest integration/sitl/pair2_identity.json --output "${EVIDENCE}/observation.json" --duration 12
          python3 tools/evaluate_pair2_sih_smoke.py --manifest integration/sitl/pair2_identity.json --observation "${EVIDENCE}/observation.json" --result "${EVIDENCE}/result.json"
      - name: Retain pair-2 SIH evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pair2-sih-runtime-evidence
          path: evidence/pair2-sih
          if-no-files-found: error
