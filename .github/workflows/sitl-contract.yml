name: SITL contract
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pair2-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/verify_pair2_identity.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
